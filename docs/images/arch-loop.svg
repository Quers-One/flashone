<svg viewBox="0 0 680 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>一代训练的完整闭环</title>
<desc>自对弈 320 局产生样本进回放池，训练 800 步后由门控判定；只有采纳时才更新 best 并补打一条 Elo 边，边库累积后做全局重拟合产出曲线。</desc>
<rect width="680" height="320" fill="#ffffff"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="56" width="132" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="78" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">① 自对弈</text>
<text x="56" y="97" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">320 局 · 1.9 万样本</text>

<rect x="196" y="56" width="132" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="212" y="78" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">② 回放池</text>
<text x="212" y="97" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">49 万样本 / 26 代</text>

<rect x="352" y="56" width="132" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="368" y="78" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">③ 训练</text>
<text x="368" y="97" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">800 步 · 约 40 秒</text>

<rect x="508" y="56" width="132" height="54" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="524" y="78" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#0C447C">④ 门控</text>
<text x="524" y="97" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">60 局 · 黑白各半</text>

<line x1="174" y1="83" x2="194" y2="83" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="330" y1="83" x2="350" y2="83" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="486" y1="83" x2="506" y2="83" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ar)"/>

<line x1="574" y1="112" x2="574" y2="146" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="470" y="148" width="150" height="40" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="545" y="173" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#2C2C2A">胜率 ≥ 0.52 ？</text>

<path d="M470 168 C 330 178, 210 196, 118 228" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="300" y="204" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#0F6E56">采纳时</text>
<text x="596" y="212" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#888780">拒绝：只写日志</text>

<rect x="40" y="230" width="150" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="253" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">边库追加一条边</text>
<text x="56" y="272" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">本代 vs 上次测量代</text>

<rect x="220" y="230" width="150" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="236" y="253" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">BT 全局重拟合</text>
<text x="236" y="272" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">全部边一起算</text>

<rect x="400" y="230" width="150" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="416" y="253" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">elo.json</text>
<text x="416" y="272" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">曲线 + 95% 区间</text>

<line x1="192" y1="258" x2="218" y2="258" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="372" y1="258" x2="398" y2="258" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar)"/>

<text x="40" y="308" font-family="system-ui,sans-serif" font-size="12" fill="#888780">一轮 8.3 分钟；绿色那段只在门控采纳时触发，约多 4 分钟</text>
</svg>
