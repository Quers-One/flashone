<svg viewBox="0 0 680 240" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>一代训练的完整闭环</title>
<desc>自对弈产生样本进回放池，训练后由门控判定；只有采纳时才追加一条 Elo 边并做全局重拟合。</desc>
<rect width="680" height="240" fill="#ffffff"/>
<defs>
  <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="41" y="56" width="136" height="62" rx="12" fill="#ffffff" stroke="#E8E6E0" stroke-width="1"/>
<text x="57" y="76" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#185FA5">01</text>
<text x="57" y="94" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">自对弈</text>
<text x="57" y="110" font-family="system-ui,sans-serif" font-size="11" fill="#888780">320 局 · 7.2 分钟</text>

<rect x="195" y="56" width="136" height="62" rx="12" fill="#ffffff" stroke="#E8E6E0" stroke-width="1"/>
<text x="211" y="76" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#185FA5">02</text>
<text x="211" y="94" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">回放池</text>
<text x="211" y="110" font-family="system-ui,sans-serif" font-size="11" fill="#888780">49 万样本 / 26 代</text>

<rect x="349" y="56" width="136" height="62" rx="12" fill="#ffffff" stroke="#E8E6E0" stroke-width="1"/>
<text x="365" y="76" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#185FA5">03</text>
<text x="365" y="94" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">训练</text>
<text x="365" y="110" font-family="system-ui,sans-serif" font-size="11" fill="#888780">800 步 · 40 秒</text>

<rect x="503" y="56" width="136" height="62" rx="12" fill="#ffffff" stroke="#E8E6E0" stroke-width="1"/>
<text x="519" y="76" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#185FA5">04</text>
<text x="519" y="94" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">门控</text>
<text x="519" y="110" font-family="system-ui,sans-serif" font-size="11" fill="#888780">60 局 · 黑白各半</text>

<line x1="179" y1="87" x2="191" y2="87" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#a1)"/>
<line x1="333" y1="87" x2="345" y2="87" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#a1)"/>
<line x1="487" y1="87" x2="499" y2="87" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#a1)"/>

<line x1="571" y1="118" x2="571" y2="138" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#a1)"/>
<rect x="496" y="140" width="150" height="30" rx="15" fill="#F1EFE8"/>
<text x="571" y="159" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#5F5E5A">胜率 ≥ 0.52 ？</text>

<path d="M496 156 C 492 172, 486 182, 482 190" fill="none" stroke="#9FE1CB" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a1)"/>

<rect x="41" y="192" width="598" height="34" rx="10" fill="#F2FAF6"/>
<text x="57" y="214" font-family="system-ui,sans-serif" font-size="12" fill="#085041">采纳时　追加一条边　›　全部边做 Bradley-Terry 重拟合　›　写 elo.json</text>
</svg>
