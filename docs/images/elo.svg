<svg viewBox="0 0 680 250" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>90 代的 Elo 曲线</title>
<desc>从 gen_002 的 0 分到 gen_092 的 +201 分，共 14 个实测点，虚线是最小二乘趋势。</desc>
<rect width="680" height="250" fill="#ffffff"/>
<defs><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="44" y="26" width="150" height="26" rx="13" fill="#F1EFE8"/>
<text x="119" y="43" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#5F5E5A">elo_edges.jsonl</text>
<line x1="200" y1="39" x2="230" y2="39" stroke="#B4B2A9" stroke-width="1.2" marker-end="url(#a4)"/>
<rect x="238" y="26" width="126" height="26" rx="13" fill="#E1F5EE"/>
<text x="301" y="43" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#085041">Bradley-Terry</text>
<line x1="370" y1="39" x2="400" y2="39" stroke="#B4B2A9" stroke-width="1.2" marker-end="url(#a4)"/>
<rect x="408" y="26" width="96" height="26" rx="13" fill="#F1EFE8"/>
<text x="456" y="43" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#5F5E5A">elo.json</text>

<line x1="92" y1="168.0" x2="604" y2="168.0" stroke="#E8E6E0" stroke-width="0.8"/>
<text x="82" y="172.0" font-family="system-ui,sans-serif" font-size="11" text-anchor="end" fill="#888780">+0</text>
<line x1="92" y1="118.0" x2="604" y2="118.0" stroke="#E8E6E0" stroke-width="0.8"/>
<text x="82" y="122.0" font-family="system-ui,sans-serif" font-size="11" text-anchor="end" fill="#888780">+100</text>
<line x1="92" y1="68.0" x2="604" y2="68.0" stroke="#E8E6E0" stroke-width="0.8"/>
<text x="82" y="72.0" font-family="system-ui,sans-serif" font-size="11" text-anchor="end" fill="#888780">+200</text>

<line x1="92" y1="168" x2="604" y2="168" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="604" y="190" font-family="system-ui,sans-serif" font-size="11" text-anchor="end" fill="#888780">gen_092</text>

<polyline fill="none" stroke="#0F6E56" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="92.0,168.0 135.6,180.4 190.0,124.9 244.5,118.0 299.0,117.0 353.4,111.1 413.4,101.6 440.6,93.4 467.8,87.2 495.1,94.4 522.3,78.8 544.1,85.6 549.5,81.9 582.2,67.7"/>
