<svg viewBox="0 0 680 250" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>从对局边库到 Elo 曲线的拟合流程</title>
<desc>每条对局只追加一行记录，全部边一起做 Bradley-Terry 最大似然拟合，锚点固定为最早一代，输出带置信区间的曲线。</desc>
<rect width="680" height="250" fill="#ffffff"/>
<defs>
  <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="42" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">elo_edges.jsonl（只追加，从不改写）</text>

<rect x="40" y="56" width="240" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="52" y="78" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#2C2C2A">gen_085 vs gen_086 · 400 局 · 0.488</text>

<rect x="40" y="98" width="240" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="52" y="120" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#2C2C2A">gen_086 vs gen_092 · 150 局 · 0.460</text>

<rect x="40" y="140" width="240" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="52" y="162" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#2C2C2A">gen_070 vs gen_096 · 150 局 · 0.520</text>

<text x="40" y="196" font-family="system-ui,sans-serif" font-size="12" fill="#888780">同一对再打一次就累加局数，旧记录不动</text>

<line x1="284" y1="112" x2="314" y2="112" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar3)"/>

<rect x="316" y="84" width="130" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="330" y="107" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#085041">BT 全局拟合</text>
<text x="330" y="126" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">最大似然 + bootstrap</text>

<line x1="450" y1="112" x2="480" y2="112" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar3)"/>

<rect x="482" y="52" width="158" height="150" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>

<line x1="500" y1="176" x2="624" y2="176" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="500" y="190" font-family="system-ui,sans-serif" font-size="12" fill="#888780">gen_002 = 0</text>

<polyline fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"
  points="502,172 522,160 542,140 562,128 582,120 602,100 620,92"/>
<line x1="502" y1="176" x2="620" y2="96" stroke="#0F6E56" stroke-width="1" opacity="0.45" stroke-dasharray="6 4"/>
<circle cx="620" cy="92" r="3.5" fill="#0F6E56"/>
<text x="612" y="84" font-family="system-ui,sans-serif" font-size="12" text-anchor="end" fill="#085041">+201</text>

<text x="40" y="236" font-family="system-ui,sans-serif" font-size="12" fill="#888780">锚点固定在最早一代；每次新增边都重算全表 ⇒ 不存在逐段拼接累积的误差</text>
</svg>
