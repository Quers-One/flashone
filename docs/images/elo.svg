<circle cx="582.2" cy="67.7" r="4.5" fill="#0F6E56"/>
<text x="574.2" y="53.7" font-family="system-ui,sans-serif" font-size="13" font-weight="500" text-anchor="end" fill="#085041">+201 Elo</text>
<text x="100" y="86" font-family="system-ui,sans-serif" font-size="11" fill="#888780">虚线 = 趋势 +2.0 Elo/代</text>

<text x="44" y="228" font-family="system-ui,sans-serif" font-size="11" fill="#888780">锚点 gen_002 = 0；每段都是同一对模型的直接对打，新增边会用全部边重算，所以老点也会微调</text>
