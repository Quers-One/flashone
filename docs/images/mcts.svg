<svg viewBox="0 0 680 215" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>MCTS 单次模拟的四个步骤与 PUCT 选择公式</title>
<desc>一次模拟依次经过选择、扩展、评估、回传；选择用 PUCT，把策略网络的先验概率乘进探索项。</desc>
<rect width="680" height="215" fill="#ffffff"/>
<defs>
  <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="42" y="44" width="132" height="56" rx="12" fill="#ffffff" stroke="#E8E6E0" stroke-width="1"/>
<text x="58" y="63" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#185FA5">01</text>
<text x="58" y="81" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">选择</text>
<text x="58" y="96" font-family="system-ui,sans-serif" font-size="11" fill="#888780">沿 PUCT 下降</text>

<rect x="194" y="44" width="132" height="56" rx="12" fill="#ffffff" stroke="#E8E6E0" stroke-width="1"/>
<text x="210" y="63" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#185FA5">02</text>
<text x="210" y="81" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">扩展</text>
<text x="210" y="96" font-family="system-ui,sans-serif" font-size="11" fill="#888780">开一个新叶</text>

<rect x="346" y="44" width="132" height="56" rx="12" fill="#ffffff" stroke="#E8E6E0" stroke-width="1"/>
<text x="362" y="63" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#185FA5">03</text>
<text x="362" y="81" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">评估</text>
<text x="362" y="96" font-family="system-ui,sans-serif" font-size="11" fill="#888780">网络给 P 与 v</text>

<rect x="498" y="44" width="140" height="56" rx="12" fill="#ffffff" stroke="#E8E6E0" stroke-width="1"/>
<text x="514" y="63" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#185FA5">04</text>
<text x="514" y="81" font-family="system-ui,sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">回传</text>
<text x="514" y="96" font-family="system-ui,sans-serif" font-size="11" fill="#888780">v 沿路径更新 Q</text>

<line x1="178" y1="72" x2="190" y2="72" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#a2)"/>
<line x1="330" y1="72" x2="342" y2="72" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#a2)"/>
<line x1="482" y1="72" x2="494" y2="72" stroke="#B4B2A9" stroke-width="1.4" marker-end="url(#a2)"/>

<rect x="42" y="122" width="596" height="42" rx="10" fill="#FAFAF8" stroke="#E8E6E0" stroke-width="1"/>
<text x="58" y="148" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#0C447C">a* = argmax [ Q(s,a) + c · P(s,a) · √N(s) / (1 + N(s,a)) ]</text>

<text x="42" y="190" font-family="system-ui,sans-serif" font-size="11" fill="#888780">Q 是分支的平均价值，P 是策略网络的先验；分母让探索项随访问次数衰减</text>
<text x="42" y="206" font-family="system-ui,sans-serif" font-size="11" fill="#888780">根节点 361 个着法，只有先验最高的 6 个进树 —— 600 次模拟才够用</text>
</svg>
